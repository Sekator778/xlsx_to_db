image: amazoncorretto:21

stages:
    - Test
    - Build

variables:
    GIT_STRATEGY: clone

test:
    stage: Test
    script:
        - echo "Running tests"
        - ./mvnw test
    only:
        - merge_requests
    tags:
        - your-runner

Prod_Build:
    stage: Build
    variables:
        GIT_STRATEGY: clone
    script:
        - ./mvnw clean deploy -DskipTests=true
    only:
        - main
    tags:
        - your-runner
