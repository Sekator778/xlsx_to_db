image: amazoncorretto:21

default:
    tags:
        - your-runner

stages:
    - Test
    - Build
    - Dependabot

variables:
    GIT_STRATEGY: clone

test:
    stage: Test
    script:
        - echo "Running tests"
        - ./mvnw test
    only:
        - merge_requests
    tags:
        - your-runner

Prod_Build:
    stage: Build
    variables:
        GIT_STRATEGY: clone
    script:
        - ./mvnw install -DskipTests=true
    only:
        - main
    tags:
        - your-runner

list_nexus_images:
    stage: Dependabot
    image: docker:latest
    script:
        - echo "Listing images in Nexus..."
        - curl "https://your-docker-registry.example.com/v2/_catalog"
    tags:
        - your-runner

dependabot:
    stage: Dependabot
    image: your-docker-registry.example.com/dependabot-core:latest
    script:
        - dependabot update
    variables:
        GITLAB_ACCESS_TOKEN: $CI_PROJECT_ACCESS_TOKEN
    rules:
        - if: '$CI_PIPELINE_SOURCE == "schedule"'
