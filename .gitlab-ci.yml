image: maven:3.8.1-jdk-11

stages:
    - test
    - tag_version

variables:
    GIT_STRATEGY: clone

test:
    stage: test
    script:
        - echo "Running tests"
    only:
        - merge_requests

tag_version:
    stage: tag_version
    script:
        - echo "Extracting version from pom.xml"
        - export VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
        - echo "Tagging version $VERSION"
        - git config --global user.email "sekator778@gmail.com"
        - git config --global user.name "sekator778"
        - git tag -a $VERSION -m "Tagging version $VERSION"
        - git push https://gitlab-ci-token:${GITLAB_ACCESS_TOKEN}@github.com/sekator778/xlsx-to-db.git $VERSION
        - echo "Tagged version $VERSION"
    only:
        - main
    except:
        - tags
